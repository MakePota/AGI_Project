[project]
name = "agi-agent"
version = "0.1.0"
description = "Reusable reasoning and tool-orchestration engine for AGI Project"
readme = "README.md"
authors = [
    { name = "zhm", email = "3482904542@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "langchain-core>=1.6.9",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "playwright>=1.63.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agi-agent = "agi_agent.cli:main"
agi-agent-api = "agi_agent.api.app:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
# 100 而不是 Ruff 默认的 88：本项目的注释是中文，中文字符在屏幕上更宽，
# 同样字符数会比英文更早换行。实测 88 会报 22 行超长、100 只报 1 行、
# 120 为 0——取 100 是「不逼着人为了凑长度而牺牲注释表达」与「别放任过长」的折中。
line-length = 100

# 只做检查、不做格式化。`ruff format` 会重排全部源文件，产出一次与功能无关的
# 巨大 diff，把真正的改动淹没。要统一格式就单独开一次提交，不要混在功能改动里。

[tool.ruff.lint]
# 规则集是**挑出来的**，不是照抄某个「严格模板」：先用大集合实测（786 条），
# 再逐条判断哪些是本项目真正想要的。避免一上来就堆规则、然后靠大范围 noqa 掩盖。
#   I    导入排序        UP   过时语法（本项目锁 3.12，用得上）
#   B    常见陷阱        SIM  可简化写法      C4   推导式
#   BLE  盲捕获          ARG  没用到的参数    RET  返回写法
#   PIE  小瑕疵          PERF 明显低效
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "BLE", "ARG", "RET", "PIE", "PERF"]

# 中文标点不是错。RUF001/002/003 会把「，」「：」「（）」判成「易与半角混淆的字符」，
# 而本项目的硬性规定就是注释用中文——开着它等于要求把中文注释改成英文标点，
# 那是本末倒置。这三条是**故意**关掉，不是漏配。
ignore = ["RUF001", "RUF002", "RUF003"]

# RUF100（「这条 noqa 是多余的」）只报、不自动修。原因是一次真实教训：
# 它判定 noqa 失效时，`--fix` 会把**整行注释连同后面的中文解释一起删掉**——
# steam.py 里「网络层什么都可能抛」那句就是这样消失的。
# 规则本身要留着（它确实能发现已经不起作用的 noqa），但处理方式必须由人判断：
# 正确做法是**去掉 noqa、保留解释**，而不是把解释一起扔掉。
unfixable = ["RUF100"]

# 刻意**没有** per-file-ignores：实测在这个规则集下，tests/ 与 src/ 一样干净，
# 不需要为测试目录开豁免。将来真出现需要豁免的地方，再按具体情况加，
# 不要预留一个"以后可能用得上"的空壳——那种配置没人敢删，也没人知道它为什么在。

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
